plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tko76.restarttv'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tko76.restarttv'
        minSdk 21   // GLOBAL_ACTION_POWER_DIALOG is available since API 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
