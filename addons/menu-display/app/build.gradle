plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tko76.menudisplay'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tko76.menudisplay'
        minSdk 28
        targetSdk 34
        versionCode 4
        versionName '1.0'
    }

    def ksFile = System.getenv('KEYSTORE_PATH') ? file(System.getenv('KEYSTORE_PATH')) : null
    def useStableKey = ksFile?.exists()
    if (useStableKey) {
        signingConfigs {
            release {
                storeFile ksFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig useStableKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
