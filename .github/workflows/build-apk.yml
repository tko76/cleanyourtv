name: Build APK

on:
  push:
    branches: [sony-vh2-setup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build launcher APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/launcher-release.jks
      - name: Build release APK
        working-directory: launcher
        env:
          KEYSTORE_PATH: /tmp/launcher-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
